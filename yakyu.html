<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阪神・広島 APIテスト</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background: #f5f5f5;
}

.box {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

pre {
    white-space: pre-wrap;
    word-break: break-all;
    background: #111;
    color: #0f0;
    padding: 20px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="box">

<h1>阪神 vs 広島 APIテスト</h1>

<p id="status">APIに接続しています...</p>

<pre id="result"></pre>

</div>

<script>

const API_KEY = "fa0c70e4fb597c0d9c0f9952dc831eaf";

const API_URL =
    "https://v1.baseball.api-sports.io/games" +
    "?date=2026-10-03" +
    "&timezone=Asia/Tokyo";


async function getGames() {

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    try {

        // 15秒でタイムアウト
        const controller =
            new AbortController();

        const timeout =
            setTimeout(() => {
                controller.abort();
            }, 15000);


        const response = await fetch(API_URL, {

            method: "GET",

            headers: {
                "x-apisports-key": API_KEY,
                "Accept": "application/json"
            },

            signal: controller.signal

        });


        clearTimeout(timeout);


        const text =
            await response.text();


        console.log("HTTP STATUS:", response.status);

        console.log("RESPONSE:", text);


        if (!response.ok) {

            throw new Error(
                "HTTPエラー " +
                response.status +
                "\n\n" +
                text
            );

        }


        const data =
            JSON.parse(text);


        status.textContent =
            "✅ API接続成功";


        result.textContent =
            JSON.stringify(data, null, 2);


    } catch (error) {

        console.error(error);


        status.textContent =
            "❌ API接続エラー";


        if (error.name === "AbortError") {

            result.textContent =
                "15秒経ってもAPIから返事がありません。\n\n" +
                "APIのURL・通信・ブラウザ側の問題を確認します。";

        } else {

            result.textContent =
                error.message;

        }

    }

}


getGames();

</script>

</body>
</html>
