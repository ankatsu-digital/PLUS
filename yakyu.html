<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>阪神タイガース 試合情報</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
      font-size: 14px;
    }

    #games {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .game {
      background: white;
      margin-bottom: 18px;
      padding: 25px 20px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .league {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    .team {
      width: 35%;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      font-size: 30px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .loading,
    .no-game,
    .error {
      background: white;
      padding: 35px 20px;
      text-align: center;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 600px) {

      .teams {
        gap: 10px;
      }

      .team {
        font-size: 16px;
      }

      .score {
        font-size: 24px;
      }

    }
  </style>
</head>


<body>

  <header>

    <h1>⚾ 阪神タイガース</h1>

    <p id="date">
      試合情報を取得しています...
    </p>

  </header>


  <main>

    <div id="games">

      <div class="loading">
        試合情報を取得しています...
      </div>

    </div>

  </main>


  <script>

    // ========================================
    // API設定
    // ========================================

    const API_KEY = "fa0c70e4fb597c0d9c0f9952dc831eaf";


    const API_URL =
      "https://v1.baseball.api-sports.io/games";


    // ========================================
    // 日本語チーム名
    // ========================================

    const teamNames = {

      // セ・リーグ
      "Hanshin Tigers": "阪神タイガース",
      "Hiroshima Carp": "広島カープ",
      "Yomiuri Giants": "読売ジャイアンツ",
      "Yokohama BayStars": "横浜DeNAベイスターズ",
      "Chunichi Dragons": "中日ドラゴンズ",
      "Yakult Swallows": "東京ヤクルトスワローズ",

      // パ・リーグ
      "Fukuoka SoftBank Hawks": "福岡ソフトバンクホークス",
      "Hokkaido Nippon-Ham Fighters": "北海道日本ハムファイターズ",
      "Chiba Lotte Marines": "千葉ロッテマリーンズ",
      "Saitama Seibu Lions": "埼玉西武ライオンズ",
      "Tohoku Rakuten Golden Eagles": "東北楽天ゴールデンイーグルス",
      "Orix Buffaloes": "オリックス・バファローズ"

    };


    // ========================================
    // 日本語チーム名に変換
    // ========================================

    function getJapaneseTeamName(
      englishName
    ) {

      return (
        teamNames[englishName] ||
        englishName
      );

    }


    // ========================================
    // 今日の日付
    // ========================================

    function getToday() {

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          now.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    // ========================================
    // 試合情報取得
    // ========================================

    async function getGames() {

      const gamesElement =
        document.getElementById("games");

      const dateElement =
        document.getElementById("date");


      const today =
        getToday();


      dateElement.textContent =
        `${today} の試合`;


      try {

        // ====================================
        // APIへアクセス
        // ====================================

        const response =
          await fetch(

            `${API_URL}?date=${today}`,

            {

              method: "GET",

              headers: {

                "x-rapidapi-key":
                  API_KEY,

                "x-rapidapi-host":
                  "v1.baseball.api-sports.io"

              }

            }

          );


        if (!response.ok) {

          throw new Error(
            `APIエラー: ${response.status}`
          );

        }


        // ====================================
        // JSON取得
        // ====================================

        const data =
          await response.json();


        console.log(
          "API取得結果:",
          data
        );


        // ====================================
        // 全試合から阪神だけ探す
        // ====================================

        const hanshinGames =
          data.response.filter(

            game => {

              const home =
                game.teams?.home?.name;

              const away =
                game.teams?.away?.name;


              return (

                home ===
                "Hanshin Tigers"

                ||

                away ===
                "Hanshin Tigers"

              );

            }

          );


        // ====================================
        // 阪神の試合がない場合
        // ====================================

        if (
          hanshinGames.length === 0
        ) {

          gamesElement.innerHTML = `

            <div class="no-game">

              <h2>
                本日の阪神戦はありません
              </h2>

              <p>
                ${today}
              </p>

            </div>

          `;

          return;

        }


        // ====================================
        // 表示をクリア
        // ====================================

        gamesElement.innerHTML = "";


        // ====================================
        // 阪神の試合を表示
        // ====================================

        hanshinGames.forEach(
          game => {


            // -------------------------------
            // チーム名
            // -------------------------------

            const homeEnglish =
              game.teams?.home?.name ||
              "ホーム";


            const awayEnglish =
              game.teams?.away?.name ||
              "ビジター";


            const homeJapanese =
              getJapaneseTeamName(
                homeEnglish
              );


            const awayJapanese =
              getJapaneseTeamName(
                awayEnglish
              );


            // -------------------------------
            // スコア
            // -------------------------------

            const homeScore =
              game.scores?.home?.total ??
              "-";


            const awayScore =
              game.scores?.away?.total ??
              "-";


            // -------------------------------
            // ステータス
            // -------------------------------

            const statusEnglish =
              game.status?.long ||
              "";


            let statusJapanese =
              statusEnglish;


            if (
              statusEnglish ===
              "Finished"
            ) {

              statusJapanese =
                "試合終了";

            }

            else if (
              statusEnglish ===
              "Not Started"
            ) {

              statusJapanese =
                "試合前";

            }

            else if (
              statusEnglish ===
              "In Progress"
            ) {

              statusJapanese =
                "試合中";

            }


            // -------------------------------
            // 試合時間
            // -------------------------------

            let gameTime = "";


            if (game.date) {

              const date =
                new Date(game.date);


              gameTime =
                date.toLocaleTimeString(
                  "ja-JP",
                  {
                    hour: "2-digit",
                    minute: "2-digit"
                  }
                );

            }


            // =================================
            // HTML作成
            // =================================

            const gameElement =
              document.createElement(
                "div"
              );


            gameElement.className =
              "game";


            gameElement.innerHTML = `

              <div class="league">
                ${game.league?.name || "NPB"}
              </div>


              <div class="teams">

                <div class="team">
                  ${awayJapanese}
                </div>


                <div class="score">

                  ${awayScore}

                  -

                  ${homeScore}

                </div>


                <div class="team">
                  ${homeJapanese}
                </div>

              </div>


              <div class="status">

                ${statusJapanese}

                ${
                  gameTime
                    ? " ・ " + gameTime
                    : ""
                }

              </div>

            `;


            gamesElement.appendChild(
              gameElement
            );

          }

        );


      } catch (error) {

        console.error(
          "試合情報取得エラー:",
          error
        );


        gamesElement.innerHTML = `

          <div class="error">

            <h2>
              試合情報を取得できませんでした
            </h2>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    // ========================================
    // 実行
    // ========================================

    getGames();

  </script>

</body>
</html>
