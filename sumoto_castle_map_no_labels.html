<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洲本城跡 地図（文字なし）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;width:100%;margin:0;padding:0}
body{overflow:hidden}
#map{background:#f5f5f0}
.leaflet-container{font-family:sans-serif}
.leaflet-control-attribution{font-size:10px!important}
.leaflet-tile{outline:1px solid transparent}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body,#map{height:100%;width:100%;overflow:hidden}
 .leaflet-control-zoom{display:none!important}
}
</style>
</head>
<body>
<div id="map" aria-label="洲本城跡周辺地図"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const center=[34.3424,134.8968];
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView(center,16);

// 地名ラベルを省いた淡色ベースマップ。線や道路も淡い表示になります。
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{
  subdomains:'abcd',
  maxZoom:20,
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

L.control.scale({imperial:false}).addTo(map);
</script>
</body>
</html>
